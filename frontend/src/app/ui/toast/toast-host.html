<div class="uc-toast-host" role="status" aria-live="polite" aria-atomic="false">
  @for (toast of service.toasts(); track toast.id) {
    <div class="uc-toast-host__item">
      <svg
        class="uc-toast-host__icon"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 8.5 6.5 12 13 4.5" />
      </svg>
      <span>{{ toast.mensagem }}</span>
    </div>
  }
</div>
