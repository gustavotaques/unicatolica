# Ambiente local reprodutível (AD-7 da Architecture Spine).
# `docker-compose up` sobe Postgres + Quarkus em dev mode + Angular dev server.
#
# Alternativa mais rápida para o dia a dia: rodar backend e frontend direto no host, com o
# Postgres subindo sozinho pelo Quarkus Dev Services (ver docs/como-funciona.md, seção
# "Rodando localmente", e docs/decisoes/2026-09-24-identidade-desacoplada.md).
#
# Uso: ./scripts/dev-setup.sh   (cria o .env e as chaves JWT) e então `docker-compose up`.
#
# target/, node_modules/ e .angular/ ficam em volumes próprios, nunca na pasta do host: os
# containers rodam como root (os arquivos ficariam com dono root) e o node_modules do Alpine
# (musl) quebra os binários nativos quando usado pelo host (glibc), e vice-versa.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pacext}
      POSTGRES_USER: ${DB_USER:-pacext}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pacext}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pacext-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pacext} -d ${DB_NAME:-pacext}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: eclipse-temurin:21-jdk
    working_dir: /workspace
    # eclipse-temurin:21-jdk não traz `unzip`; sem ele o mvnw troca silenciosamente para
    # baixar a distribuição .tar.gz do Maven, mas o checksum fixado em
    # maven-wrapper.properties é o do .zip — a validação sempre falha. Instala `unzip`
    # antes de delegar pro mvnw (só na primeira vez por volume, é rápido via apt cache).
    entrypoint: ['sh', '-c']
    command:
      - |
        set -e
        command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip)
        exec ./mvnw quarkus:dev -Dquarkus.http.host=0.0.0.0
    volumes:
      - ./backend:/workspace
      - pacext-backend-target:/workspace/target
      - pacext-maven-repo:/root/.m2
    environment:
      # URL explícita desliga o Dev Services (que não roda dentro de container) e usa o "db".
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/${DB_NAME:-pacext}
      QUARKUS_DEVSERVICES_ENABLED: 'false'
      DB_USER: ${DB_USER:-pacext}
      DB_PASSWORD: ${DB_PASSWORD:-pacext}
      JWT_ISSUER: ${JWT_ISSUER:-https://pacext.unicatolica.edu.br}
      # Par de chaves JWT (Story 1.4) — conteúdo PEM bruto via .env, nunca arquivo commitado
      # (ver .env.example para como gerar um par local). Sem valor aqui, o Quarkus sobe com
      # uma chave em memória (só dev, log de aviso) — login/validação não funcionam entre
      # reinícios do container.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - '8080:8080' # API REST
      - '5005:5005' # debug remoto (JPDA)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c '</dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    image: node:24-alpine
    working_dir: /workspace
    # npm ci só quando o package-lock.json mudou desde a última instalação.
    command:
      ['sh', '-c', '[ node_modules/.package-lock.json -nt package-lock.json ] || npm ci; exec npm start -- --host 0.0.0.0']
    volumes:
      - ./frontend:/workspace
      - pacext-frontend-node-modules:/workspace/node_modules
      - pacext-frontend-angular-cache:/workspace/.angular
    environment:
      NODE_ENV: development
      API_URL: ${API_URL:-http://localhost:8080}
    # Sem depends_on: o dev server sobe em paralelo com o backend; as chamadas à API só
    # falham até o Quarkus terminar de subir.
    ports:
      - '4200:4200'

volumes:
  pacext-db-data:
  pacext-maven-repo:
  pacext-backend-target:
  pacext-frontend-node-modules:
  pacext-frontend-angular-cache:
