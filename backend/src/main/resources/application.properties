# UniCatolica backend - configuracao inicial (checkpoint PAC VI)

quarkus.application.name=unicatolica-backend

# Banco de dados (PostgreSQL) - ajustar via variaveis de ambiente / .env
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:unicatolica}
quarkus.datasource.password=${DB_PASSWORD:unicatolica}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/unicatolica}

# Hibernate ORM - gera schema automaticamente em desenvolvimento
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# CORS (frontend Angular local)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
