# Par de chaves RSA só para @QuarkusTest — gerado unicamente para este arquivo, nunca
# reaproveitado de nenhum ambiente real (dev/prod). Sem isso, POST /auth/login falha ao
# decodificar mp.jwt.verify.publickey/pacext.jwt.sign.key, que no CI/ambiente real vêm de
# JWT_PUBLIC_KEY/JWT_PRIVATE_KEY (não setadas para os testes, só para dev/prod via .env).
mp.jwt.verify.
pacext.jwt.sign.
